# Competition config — higher capacity for the real Kaggle run
# Use this instead of default.yaml for full training

model:
  in_channels: 1
  base_features: 12          # 12 initial feature maps (from paper/repo)
  feature_multiplier: 3.0    # Increase by factor of 3 at each level
  downsample_factors:
    - [1, 2, 2]              # level 0: no Z downsampling (anisotropic)
    - [2, 2, 2]              # level 1
    - [2, 2, 2]              # level 2
  nms_kernel: 5              # larger NMS window → fewer duplicate peaks
  nms_threshold: 0.4         # slightly lower threshold for better recall

data:
  data_root: train
  patch_size: [48, 192, 192] # larger patches → more context
  train_full_volume: false
  gaussian_sigma: [1.5, 2.5, 2.5]  # slightly wider blobs for anisotropic voxels
  cell_mask_radius: 3        # slightly larger movement-vector mask
  scale: [1.625, 0.40625, 0.40625]
  normalize_mode: percentile # percentile normalisation is more robust to outliers
  reject_empty: true
  center_on_cell_prob: 0.6   # centre on a cell more often
  input_shape: [64, 256, 256]

training:
  lr: 5.0e-5                 # lower LR with larger model
  batch_size: 1              # full 64×256×256 patches are large; use 1 per GPU
  epochs: 150
  amp: true
  swa_start_epoch: 120       # SWA in last 30 epochs
  val_every: 250             # validate more frequently
  w_bg: 12.0                 # slightly stronger background penalty (sparse GT)
  w_fg: 1.0
  lambda_mv: 0.5             # down-weight vector loss early (curriculum handles rest)
  vector_mask_mode: curriculum
  vector_curriculum_epoch: 75  # switch to maxima-only at half-way
  checkpoint_dir: checkpoints_competition
  num_workers: 4
  val_embryo_fraction: 0.15  # smaller val set → more training data
  seed: 0
  weight_decay: 1.0e-4
  patience: 5

inference:
  max_link_distance_um: 7.0
  batch_size: 1
  checkpoint: checkpoints_competition/best.pt
  output: submission.csv
