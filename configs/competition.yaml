# Competition config — synced with kaggle_train.ipynb and recommended fixes

model:
  in_channels: 1
  base_features: 16
  feature_multiplier: 3.0
  downsample_factors:
    - [1, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  nms_kernel: 5
  nms_threshold: 0.4

data:
  data_root: train
  patch_size: [16, 128, 128]
  train_full_volume: false
  gaussian_sigma: [0.5, 2.0, 2.0]
  cell_mask_radius: 2.5
  scale: [1.625, 0.40625, 0.40625]
  normalize_mode: percentile
  reject_empty: true
  center_on_cell_prob: 0.5
  input_shape: [16, 128, 128]

training:
  lr: 2.5e-5
  batch_size: 4
  gradient_accumulation_steps: 2
  epochs: 150
  amp: true
  swa_start_epoch: 80
  val_every: 250
  w_bg: 1.0
  w_fg: 10.0
  lambda_mv: 1.0
  vector_mask_mode: full
  vector_curriculum_epoch: 40
  checkpoint_dir: checkpoints_competition
  num_workers: 4
  val_embryo_fraction: 0.25
  seed: 42
  weight_decay: 1.0e-4
  patience: 0

inference:
  max_link_distance_um: 7.0
  batch_size: 1
  checkpoint: checkpoints_competition/best.pt
  output: submission.csv
