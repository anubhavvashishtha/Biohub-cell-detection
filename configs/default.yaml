model:
  in_channels: 1
  base_features: 16
  downsample_factors:
    - [1, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  nms_kernel: 3
  nms_threshold: 0.5

data:
  data_root: train
  patch_size: [48, 128, 128]
  train_full_volume: false
  gaussian_sigma: [1.0, 2.0, 2.0]
  cell_mask_radius: 2
  scale: [1.625, 0.40625, 0.40625]
  normalize_mode: per_volume
  reject_empty: true
  center_on_cell_prob: 0.5
  input_shape: [64, 256, 256]

training:
  lr: 1.0e-4
  batch_size: 2
  gradient_accumulation_steps: 1
  epochs: 100
  amp: true
  swa_start_epoch: 80
  val_every: 500
  w_bg: 10.0
  w_fg: 1.0
  lambda_mv: 1.0
  vector_mask_mode: full
  vector_curriculum_epoch: 50
  checkpoint_dir: checkpoints
  num_workers: 4
  val_embryo_fraction: 0.2
  seed: 42

inference:
  max_link_distance_um: 7.0
  batch_size: 1
  checkpoint: checkpoints/best.pt
  output: submission.csv
